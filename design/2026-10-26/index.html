function card(name, i){

  const chk = document.createElement('div');

document.getElementById('q').addEventListener('input', e => {
  const t = e.target.value.trim().toLowerCase();
  view = t ? FILES.filter(n => n.toLowerCase().includes(t)) : FILES.slice();
  render();
});

document.getElementById('all').onclick = () => { view.forEach(n => sel.add(n)); render(); };
document.getElementById('none').onclick = () => { sel.clear(); render(); };

function links(){
  return Array.from(sel).sort().map(n => RAW_BASE + n + '.png').join('\n');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}
function copyLinks(){
  if (!sel.size) return alert('Ã–nce gÃ¶rsel seÃ§in.');
  const txt = links();
  navigator.clipboard.writeText(txt).then(() => toast(sel.size + ' link kopyalandÄ±'), () => {
    const w = window.open('', '_blank');
    w.document.write('<pre>' + txt.replace(/</g,'&lt;') + '</pre>');
  });
}
document.getElementById('copy').onclick = copyLinks;
document.getElementById('copy2').onclick = copyLinks;
document.getElementById('openselected').onclick = () => {
  if (!sel.size) return alert('Ã–nce gÃ¶rsel seÃ§in.');
  if (!confirm(sel.size + ' gÃ¶rsel yeni sekmelerde aÃ§Ä±lacak. Devam?')) return;
  Array.from(sel).sort().forEach(n => window.open(n + '.png', '_blank'));
};

render();
</script>
